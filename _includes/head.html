{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- Icons. The files ship with the theme but were not linked from anywhere. -->
<link rel="icon" href="{{ base_path }}/images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon-180x180.png">
<link rel="manifest" href="{{ base_path }}/images/manifest.json">

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<!-- Demo clip sizing. Kept here rather than as an inline style attribute,
     which the compress_html layout mangles when attributes span lines. -->
<style>
  /* Clips sit at 75% of the text column so they read as figures rather than
     taking over the page. Full width on narrow screens, where 75% is too small. */
  .demo-video { margin: 1.5em 0; max-width: 75%; }
  .demo-video__player { display: block; width: 100%; height: auto; background: #000; }
  .demo-video figcaption { font-size: 0.8em; line-height: 1.5; opacity: .75; padding-top: .4em; }
  @media (max-width: 768px) {
    .demo-video { max-width: 100%; }
  }
</style>
