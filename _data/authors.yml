# Additional authors, used only for guest-authored posts.
#
# The theme reads this file when a page sets an "author:" key in its front
# matter. Nothing on this site does, so the file is intentionally empty and the
# sidebar falls back to the author block in _config.yml.
#
# To add a guest author, uncomment and edit:
#
# Jane Doe:
#   name   : "Jane Doe"
#   uri    : "https://example.edu/~jdoe"
#   email  : "jdoe@example.edu"
#   bio    : "One-line biography."
#   avatar : "jane-doe.jpg"   # a file in images/
